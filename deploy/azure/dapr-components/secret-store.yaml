# Logical secret store abstraction. The name "secret-store" is identical to
# the local environment; the Azure implementation is Azure Key Vault with
# Microsoft Entra Workload ID authentication. Application configuration only
# ever references secret names (for example AgentRuntime:RemoteModel:
# ApiKeySecretName); values stay in Key Vault.
#
# Replace the placeholders before applying:
#   <KEY_VAULT_NAME>            infra output `keyVaultName`
#   <WORKLOAD_CLIENT_ID>        infra output `workloadIdentityClientId`
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secret-store
  namespace: agentic-ops
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    - name: vaultName
      value: "<KEY_VAULT_NAME>"
    - name: azureClientId
      value: "<WORKLOAD_CLIENT_ID>"
scopes:
  - incident-api
