# Logical state store component. The name "incident-state" is identical to the
# local environment; the Azure implementation is Azure Table Storage with
# Microsoft Entra Workload ID authentication — shared-key access is disabled on
# the storage account.
#
# Replace the placeholders before applying:
#   <STORAGE_ACCOUNT_NAME>      infra output `storageAccountName`
#   <WORKLOAD_CLIENT_ID>        infra output `workloadIdentityClientId`
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: incident-state
  namespace: agentic-ops
spec:
  type: state.azure.tablestorage
  version: v1
  metadata:
    - name: accountName
      value: "<STORAGE_ACCOUNT_NAME>"
    - name: tableName
      value: "incidentstate"
    - name: azureClientId
      value: "<WORKLOAD_CLIENT_ID>"
scopes:
  - incident-api
