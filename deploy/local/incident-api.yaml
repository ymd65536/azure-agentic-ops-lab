# IncidentApi hosts the full incident workflow in-process, including the mock
# ExecutionService (dry-run). It never talks to the Kubernetes API in this
# milestone, so its service account carries no RBAC bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-api
  namespace: agentic-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: incident-api
    app.kubernetes.io/part-of: azure-agentic-ops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-api
        app.kubernetes.io/part-of: azure-agentic-ops-lab
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "incident-api"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: incident-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incident-api
          image: incident-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Dapr__Enabled
              value: "true"
            - name: DOTNET_EnableDiagnostics
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: incident-api
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: incident-api
spec:
  selector:
    app.kubernetes.io/name: incident-api
  ports:
    - name: http
      port: 80
      targetPort: http
