# OpsConsole renders the incident workflow, its lifecycle timeline, and the
# human approval gate. It only reads from the IncidentApi and forwards human
# decisions; it never executes remediation and needs no Kubernetes permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-console
  namespace: agentic-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: ops-console
    app.kubernetes.io/part-of: azure-agentic-ops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-console
        app.kubernetes.io/part-of: azure-agentic-ops-lab
      annotations:
        dapr.io/enabled: "false"
        dapr.io/app-id: "ops-console"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: ops-console
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops-console
          image: ops-console:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OpsConsole__IncidentApiBaseUrl
              value: "http://incident-api.agentic-ops.svc.cluster.local"
            - name: DOTNET_EnableDiagnostics
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: ops-console
spec:
  selector:
    app.kubernetes.io/name: ops-console
  ports:
    - name: http
      port: 80
      targetPort: http
