# Logical secret store abstraction. The name "secret-store" is stable across
# environments; locally it resolves to Kubernetes Secrets (development values
# only) and the Azure environment substitutes Azure Key Vault.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secret-store
  namespace: agentic-ops
spec:
  type: secretstores.kubernetes
  version: v1
scopes:
  - incident-api
