# ScribeService is an asynchronous Pub/Sub consumer: it subscribes to
# incident-lifecycle events through the incident-pubsub Dapr component, builds
# ordered timelines, and serves deterministic post-incident record drafts. It
# is never on the critical remediation path, so an outage here cannot block
# investigation, remediation, or verification. It never talks to the
# Kubernetes API, so its service account carries no RBAC bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scribe-service
  namespace: agentic-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribe-service
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: scribe-service
    app.kubernetes.io/part-of: azure-agentic-ops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scribe-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scribe-service
        app.kubernetes.io/part-of: azure-agentic-ops-lab
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "scribe-service"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: scribe-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scribe-service
          image: scribe-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scribe-service
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: scribe-service
spec:
  selector:
    app.kubernetes.io/name: scribe-service
  ports:
    - name: http
      port: 80
      targetPort: http
